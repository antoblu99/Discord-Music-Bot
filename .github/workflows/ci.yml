name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt | diff - requirements.lock
      - name: Build Docker image
        run: docker build -t discord-music-bot:local -t discord-music-bot:${{ github.sha }} .
      - name: Export installable Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker save discord-music-bot:local discord-music-bot:${{ github.sha }} --output discord-music-bot-linux-amd64.tar
          gzip discord-music-bot-linux-amd64.tar
      - name: Upload Docker image for manual installation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: discord-music-bot-linux-amd64
          path: discord-music-bot-linux-amd64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
