[project]
name = "discord-music-bot"
version = "1.0.0"
description = "A self-hosted Discord music bot for private servers"
requires-python = ">=3.12"
dependencies = ["discord.py[voice]>=2.7,<3", "yt-dlp[default]>=2026.3.17"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
